                    type: object
                    properties:
                      total_visits:
                        type: integer
                        description: Visite totali.
                      total_visits_last_days:
                        type: integer
                        description: Visite negli ultimi 'days' giorni.
                      total_visits_last_days_percent:
                        type: number
