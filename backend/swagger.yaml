                      total_gain:
                        type: number
                        format: float
                        description: Guadagno totale.
                      total_gain_last_days:
                        type: number
                        format: float
                        description: Guadagno negli ultimi 'days' giorni.
                      total_gain_last_days_percent:
                        type: number
                        format: float
                        description: Percentuale di guadagno negli ultimi 'days' giorni rispetto al totale.
