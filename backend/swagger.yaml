openapi: 3.0.0
info:
  title: API Baclemd - Proxy per microservices
  description: API aggregata per i microservizi di un e-commerce artigianale
  version: 1.0.0
servers:
  - url: https://localhost:3000
    description: API Gateway principale
tags:
  - name: Users
    description: Operazioni relative alla gestione degli utenti e all'autenticazione.
  - name: Products
    description: Gestione e recupero dei prodotti.
  - name: Purchases
    description: Gestione del carrello, ordini e rimborsi.
  - name: Tickets
    description: Gestione dei ticket di supporto per prodotti e ordini.
  - name: Images
    description: Caricamento e recupero di immagini.
  - name: Health Check
    description: Endpoint per la verifica dello stato dei servizi.

security:
  - cookieAuth: []

paths:
  # USERS MICROSERVICE PATHS
  /user:
    post:
      summary: Registrazione di un nuovo utente
      tags:
        - Users
      description: Permette la registrazione di un nuovo utente con ruolo 'customer' o 'artisan'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - surname
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  example: Mario
                surname:
                  type: string
                  example: Rossi
                email:
                  type: string
                  format: email
                  example: mario.rossi@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123!
                role:
                  type: string
                  enum: [customer, artisan]
                  description: Ruolo dell'utente (cliente o artigiano).
                  example: customer
      responses:
        '200':
          description: Utente registrato con successo.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: jwt=your_jwt_token; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: mario.rossi@example.com
                  name:
                    type: string
                    example: Mario
                  surname:
                    type: string
                    example: Rossi
                  id_role:
                    type: integer
                    example: 1
                  roleName:
                    type: string
                    example: customer
        '400':
          $ref: '#/components/responses/BadRequest'
        '512':
          description: Violazione di unicità (email già registrata).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 512
                message: Email already registered.
        '516':
          description: Formato password non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 516
                message: Invalid password format.
        '517':
          description: Formato email non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 517
                message: Invalid email format.
        '518':
          description: Errore durante la generazione dello slug utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 518
                message: Error generating user slug.
        '522':
          description: Ruolo utente non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 522
                message: Invalid user role.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Ottiene il profilo dell'utente autenticato
      tags:
        - Users
      description: Recupera le informazioni del profilo dell'utente autenticato tramite JWT.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Informazioni del profilo recuperate con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Mario
                  surname:
                    type: string
                    example: Rossi
                  role:
                    type: string
                    example: customer
                  bio:
                    type: string
                    nullable: true
                    example: Sono un artigiano specializzato in ceramica.
                  url_profile_picture:
                    type: string
                    format: url
                    nullable: true
                    example: https://localhost:3000/images/profile_pic_id
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '515':
          description: Utente non trovato (per l'ID nel JWT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 515
                message: User not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Aggiorna il profilo utente autenticato
      tags:
        - Users
      description: Aggiorna le informazioni del profilo dell'utente autenticato.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Nuovo indirizzo email (verrà convalidato).
                  example: nuovo.email@example.com
                name:
                  type: string
                  example: Luigi
                surname:
                  type: string
                  example: Verdi
                bio:
                  type: string
                  nullable: true
                  example: Nuova descrizione della biografia.
                password:
                  type: string
                  format: password
                  description: Nuova password (verrà hashata).
                id_profile_picture:
                  type: string
                  format: uuid
                  nullable: true
                  description: ID della nuova immagine del profilo.
                  example: 123e4567-e89b-12d3-a456-426614174000
              minProperties: 1 # Almeno un campo deve essere presente per l'aggiornamento
      responses:
        '200':
          description: Profilo aggiornato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  password_changed:
                    type: boolean
                    description: Indica se la password è stata modificata.
                    example: true
                  email:
                    type: string
                    format: email
                    example: nuovo.email@example.com
                  name:
                    type: string
                    example: Luigi
                  surname:
                    type: string
                    example: Verdi
                  bio:
                    type: string
                    example: Nuova descrizione della biografia.
                  id_profile_picture:
                    type: string
                    format: uuid
                    example: 123e4567-e89b-12d3-a456-426614174000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '512':
          description: L'email fornita è già in uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 512
                message: Email already registered.
        '516':
          description: Formato password non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 516
                message: Invalid password format.
        '517':
          description: Formato email non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 517
                message: Invalid email format.
        '521':
          description: ID immagine del profilo non valido o non esistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 521
                message: Invalid image ID.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /login:
    post:
      summary: Login utente
      tags:
        - Users
      description: Autentica un utente tramite email e password e imposta un cookie JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: mario.rossi@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123!
      responses:
        '200':
          description: Login riuscito. Il cookie JWT è impostato.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: jwt=your_jwt_token; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: mario.rossi@example.com
                  name:
                    type: string
                    example: Mario
                  surname:
                    type: string
                    example: Rossi
                  id_role:
                    type: integer
                    example: 1
                  roleName:
                    type: string
                    example: customer
        '400':
          $ref: '#/components/responses/BadRequest'
        '513':
          description: Utente non trovato (email non registrata).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 513
                message: User not found.
        '514':
          description: Password non corretta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 514
                message: Incorrect password.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logout:
    post:
      summary: Logout utente
      tags:
        - Users
      description: Effettua il logout dell'utente invalidando il cookie JWT.
      responses:
        '200':
          description: Logout riuscito. Il cookie JWT è invalidato.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: jwt=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=Lax
        '500':
          $ref: '#/components/responses/InternalServerError'
  /user/{user_slug}:
    get:
      summary: Ottiene il profilo di un utente per slug
      tags:
        - Users
      description: Recupera le informazioni del profilo di un utente specifico utilizzando il suo slug.
      parameters:
        - in: path
          name: user_slug
          schema:
            type: string
          required: true
          description: Lo slug identificativo dell'utente (es. "mario-rossi").
          example: "mario-rossi"
      responses:
        '200':
          description: Informazioni del profilo recuperate con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Mario
                  surname:
                    type: string
                    example: Rossi
                  role:
                    type: string
                    example: customer
                  bio:
                    type: string
                    nullable: true
                    example: Sono un artigiano specializzato in ceramica.
                  url_profile_picture:
                    type: string
                    format: url
                    nullable: true
                    example: https://localhost:3000/images/profile_pic_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '515':
          description: Utente non trovato per lo slug fornito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 515
                message: User not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dashboardPage:
    get:
      summary: Ottiene il link della dashboard in base al ruolo
      tags:
        - Users
      description: Restituisce l'URL della pagina della dashboard appropriata in base al ruolo dell'utente autenticato (admin, customer, artisan).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Link della dashboard recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboardLink:
                    type: string
                    description: L'URL della dashboard specifico per il ruolo dell'utente.
              examples:
                AdminDashboard:
                  summary: Esempio per Amministratore
                  value:
                    dashboardLink: "/admin/area-riservata"
                CustomerDashboard:
                  summary: Esempio per Cliente
                  value:
                    dashboardLink: "/clienti/area-riservata"
                ArtisanDashboard:
                  summary: Esempio per Artigiano
                  value:
                    dashboardLink: "/artigiani/area-riservata"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /isLoggedIn:
    get:
      summary: Verifica lo stato di login dell'utente
      tags:
        - Users
      description: Controlla se l'utente è attualmente loggato, verificando la presenza del cookie JWT.
      responses:
        '200':
          description: Stato di login restituito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loggedIn:
                    type: boolean
                    example: true
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reviewArtisan/{artisan_slug}:
    post:
      summary: Aggiunge o aggiorna una recensione per un artigiano
      tags:
        - Users
      description: Consente a un cliente di lasciare o modificare una recensione per un artigiano specifico. Se una recensione esiste già dallo stesso utente per lo stesso artigiano, verrà sovrascritta.
      operationId: addOrUpdateArtisanReview
      security:
        - CookieAuth: []
      parameters:
        - in: path
          name: artisan_slug
          schema:
            type: string
          required: true
          description: Lo slug dell'artigiano a cui aggiungere/aggiornare la recensione.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  description: Il voto della recensione (da 0 a 5).
                  minimum: 0
                  maximum: 5
                review_text:
                  type: string
                  description: Il testo della recensione.
                  maxLength: 500 # Esempio di limite di lunghezza
              required:
                - rating
                - review_text
      responses:
        '200':
          description: Recensione aggiunta o aggiornata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artisan:
                    type: string
                    description: Lo slug dell'artigiano recensito.
                  rating:
                    type: integer
                    description: Il voto assegnato.
                  review_text:
                    type: string
                    description: Il testo della recensione.
        '400':
          description: Richiesta non valida (es. campi mancanti o formato errato, rating fuori range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non autorizzato (solo i clienti possono lasciare recensioni).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Artigiano non trovato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reviews/{artisan_slug}/{page}:
    get:
      summary: Ottiene le recensioni di un artigiano specifico
      tags:
        - Users
      description: Recupera un elenco di recensioni per un artigiano, con paginazione.
      operationId: getArtisanReviewsPaged
      security:
        - CookieAuth: []
      parameters:
        - in: path
          name: artisan_slug
          schema:
            type: string
          required: true
          description: Lo slug dell'artigiano di cui ottenere le recensioni.
        - in: path
          name: page
          schema:
            type: integer
            minimum: 1
          required: true
          description: Il numero della pagina delle recensioni da recuperare (a partire da 1).
      responses:
        '200':
          description: Elenco di recensioni recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    description: Il numero della pagina corrente.
                  reviews_this_page:
                    type: integer
                    description: Il numero di recensioni in questa pagina.
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review' # Riferimento al nuovo schema Review
                required:
                  - page
                  - reviews_this_page
                  - reviews
        '400':
          description: Richiesta non valida (es. numero di pagina non intero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Artigiano non trovato o pagina non valida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /userSlug:
    get:
      summary: Ottiene lo slug dell'utente autenticato
      tags:
        - Users
      description: Restituisce lo slug dell'utente attualmente autenticato.
      operationId: getUserSlug
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Slug dell'utente recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug:
                    type: string
                    description: Lo slug dell'utente autenticato.
                required:
                  - slug
        '401':
          description: Non autorizzato (token JWT mancante o non valido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '515':
          description: Utente non trovato (se l'ID utente dal JWT non corrisponde a nessun utente nel database).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /requestOTP:
    post:
      summary: Richiede un codice OTP per il recupero password
      description: Invia un codice OTP all'indirizzo email fornito per avviare il processo di recupero password.
      operationId: requestOTP
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: L'indirizzo email dell'utente che richiede l'OTP.
              required:
                - email
      responses:
        '200':
          description: Richiesta OTP inviata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
        '400':
          description: Richiesta non valida (es. email mancante o formato errato).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '515':
          description: Utente non trovato per l'email specificata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server durante l'invio dell'OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /resetPassword:
    post:
      summary: Resetta la password dell'utente tramite OTP
      description: Consente all'utente di impostare una nuova password utilizzando un codice OTP valido ricevuto via email.
      operationId: resetPassword
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: L'indirizzo email dell'utente.
                otp:
                  type: string
                  description: Il codice OTP ricevuto via email.
                password:
                  type: string
                  format: password
                  description: La nuova password per l'account.
              required:
                - email
                - otp
                - password
      responses:
        '200':
          description: Password resettata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
        '400':
          description: Richiesta non valida (es. campi mancanti o formato errato).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Codice OTP non corretto o non valido per l'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '515':
          description: Utente non trovato per l'email specificata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '516':
          description: Formato password non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '526':
          description: Il codice OTP è scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server durante il reset della password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/artisans/{page}:
    get:
      summary: Ottiene un elenco paginato di artigiani
      description: Restituisce un elenco di artigiani con le loro informazioni di base, inclusi i totali e le medie delle recensioni. La lista è paginata.
      operationId: getArtisansPaged
      tags:
        - Users
      parameters:
        - in: path
          name: page
          schema:
            type: integer
            minimum: 1
          required: true
          description: Il numero della pagina di artigiani da recuperare (a partire da 1).
      responses:
        '200':
          description: Elenco di artigiani recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artisans:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Nome dell'artigiano.
                        surname:
                          type: string
                          description: Cognome dell'artigiano.
                        photoProfile:
                          type: string
                          format: url
                          nullable: true
                          description: URL della foto profilo dell'artigiano.
                        link:
                          type: string
                          format: uri
                          description: Link alla pagina dettaglio dell'artigiano.
                        reviews_total:
                          type: integer
                          description: Numero totale di recensioni ricevute dall'artigiano.
                          minimum: 0
                        reviews_avg:
                          type: number
                          format: float
                          description: Media delle recensioni ricevute dall'artigiano (0.0-5.0).
                          minimum: 0.0
                          maximum: 5.0
                      required:
                        - name
                        - surname
                        - link
                        - reviews_total
                        - reviews_avg
                  pages:
                    type: integer
                    description: Il numero totale di pagine disponibili.
                    minimum: 1
                  num_artisans:
                    type: integer
                    description: Il numero totale di artigiani nel sistema.
                    minimum: 0
                required:
                  - artisans
                  - pages
                  - num_artisans
        '400':
          description: Richiesta non valida (es. numero di pagina non intero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pagina non trovata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # PRODUCTS MICROSERVICE PATHS
  /products/status:
    get:
      summary: Health check del servizio Products
      tags:
        - Health Check
      description: Verifica lo stato di salute del microservizio Products.
      responses:
        '200':
          description: Servizio attivo e funzionante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: products
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products:
    get:
      summary: Ottiene tutti i prodotti (senza paginazione)
      tags:
        - Products
      description: Recupera un elenco di tutti i prodotti disponibili nel sistema. Non supporta paginazione o filtri su questo endpoint.
      responses:
        '200':
          description: Elenco di prodotti recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  numberProducts:
