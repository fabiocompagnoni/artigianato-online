      description: Aggiunge nuovi prodotti al carrello dell'utente o aggiorna la quantità di prodotti esistenti.
                   Una quantità negativa può rimuovere prodotti dal carrello. Richiede il ruolo di Cliente.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - id
                  - quantity
                properties:
                  id:
                    type: integer
                    description: ID del prodotto.
                    example: 101
                  quantity:
                    type: integer
                    description: Quantità da aggiungere/sottrarre (può essere negativo per rimuovere).
                    example: 2
              example:
                - id: 101
                  quantity: 2
                - id: 102
                  quantity: -1
      responses:
        '200':
          description: Carrello aggiornato con successo.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 101
                    quantity:
                      type: integer
                      example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '523':
          description: Prodotto non trovato nel database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 523
                message: Product not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/cart:
    get:
      summary: Ottiene il contenuto del carrello
      tags:
        - Purchases
      description: Recupera l'elenco dei prodotti attualmente presenti nel carrello dell'utente autenticato. Richiede il ruolo di Cliente.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Contenuto del carrello recuperato con successo.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                      description: Slug completo del prodotto (artigiano_slug/prodotto_slug).
                      example: "nome-cognome/prodotto-xyz"
                    quantity:
                      type: integer
                      example: 2
              example:
                - slug: "mario-rossi/vaso-blu"
                  quantity: 1
                - slug: "paolo-verdi/tavolo-legno"
                  quantity: 1
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/orders/{page}:
    get:
      summary: Ottiene un elenco paginato di ordini per l'utente autenticato
      description: Recupera un elenco paginato degli ordini. I clienti vedranno solo i propri ordini. Gli artigiani vedranno gli ordini che contengono i loro prodotti. Gli amministratori vedranno tutti gli ordini.
      operationId: getOrdersPaged
      tags:
        - Purchases
      security:
        - CookieAuth: []
      parameters:
        - in: path
          name: page
          schema:
            type: integer
            minimum: 1
          required: true
          description: Il numero della pagina degli ordini da recuperare (a partire da 1).
      responses:
        '200':
          description: Elenco di ordini recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID dell'ordine.
                          format: int64
                        timestamp:
                          type: string
                          format: date-time
                          description: Data e ora di creazione dell'ordine.
                        payment_intent:
                          type: string
                          description: ID dell'intento di pagamento associato all'ordine.
                          nullable: true
                        amount_paid:
                          type: number
                          format: float
                          description: Importo totale pagato per l'ordine.
                        num_products:
                          type: integer
                          description: Numero totale di articoli (quantità aggregata) nell'ordine.
                        products:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Nome del prodotto nell'ordine.
                              thumbnail:
                                type: string
                                format: url
                                nullable: true
                                description: URL della miniatura del prodotto.
                            required:
                              - name
                              - thumbnail
                          description: Lista dei prodotti inclusi nell'ordine (nome e miniatura).
                        status:
                          type: string
                          description: Stato complessivo dell'ordine (il più "basso" tra gli stati degli articoli).
                      required:
                        - id
                        - timestamp
                        - payment_intent
                        - amount_paid
                        - num_products
                        - products
                        - status
                  pages:
                    type: integer
                    description: Il numero totale di pagine disponibili per gli ordini filtrati.
                    minimum: 0
                  num_orders:
                    type: integer
                    description: Il numero totale di ordini per l'utente/filtro corrente.
                    minimum: 0
                required:
                  - orders
                  - pages
                  - num_orders
        '400':
          description: Richiesta non valida (es. numero di pagina mancante o non intero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorizzato (token JWT mancante o non valido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (L'utente non ha i permessi per accedere a questi ordini).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server durante il recupero degli ordini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /purchases/refund:
    post:
      summary: Effettua un rimborso (Admin)
      tags:
        - Purchases
      description: Permette a un amministratore di rimborsare un prodotto specifico all'interno di un ordine. Richiede il ruolo di Amministratore.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - product_id
                - order_id
              properties:
                amount:
                  type: number
                  format: float
                  description: L'importo da rimborsare per il prodotto (in valuta intera, non centesimi).
                  example: 15.50
                product_id:
                  type: integer
                  format: int64
                  description: L'ID del prodotto all'interno dell'ordine da rimborsare.
                  example: 101
                order_id:
                  type: integer
                  format: int64
                  description: L'ID dell'ordine a cui appartiene il prodotto.
                  example: 1
      responses:
        '200':
          description: Rimborso elaborato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/customers/{page}:
    get:
      summary: Ottiene un elenco paginato di clienti per un artigiano
      description: Consente a un artigiano di recuperare un elenco paginato dei clienti che hanno acquistato i suoi prodotti. La risposta include dettagli sugli acquisti totali di ciascun cliente. Richiede il ruolo di Artigiano.
      operationId: getArtisanCustomersPaged
      tags:
        - Purchases
      security:
        - CookieAuth: []
      parameters:
        - in: path
          name: page
          schema:
            type: integer
            minimum: 1
          required: true
          description: Il numero della pagina dei clienti da recuperare (a partire da 1).
      responses:
        '200':
          description: Elenco di clienti recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Nome del cliente.
                        surname:
                          type: string
                          description: Cognome del cliente.
                        email:
                          type: string
                          format: email
                          description: Indirizzo email del cliente.
                        num_orders:
                          type: integer
                          description: Numero totale di ordini effettuati dal cliente con i prodotti dell'artigiano.
                          minimum: 0
                        num_products:
                          type: integer
                          description: Numero totale di prodotti acquistati dal cliente dall'artigiano (quantità aggregata).
                          minimum: 0
                        amount_paid:
                          type: number
                          format: float
                          description: Importo totale speso dal cliente per i prodotti dell'artigiano.
                          minimum: 0.0
                      required:
                        - name
                        - surname
                        - email
                        - num_orders
                        - num_products
                        - amount_paid
                  pages:
                    type: integer
                    description: Il numero totale di pagine disponibili per i clienti dell'artigiano.
                    minimum: 0
                  num_customers:
                    type: integer
                    description: Il numero totale di clienti per l'artigiano.
                    minimum: 0
                required:
                  - customers
                  - pages
                  - num_customers
        '400':
          description: Richiesta non valida (es. numero di pagina mancante o non intero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorizzato (token JWT mancante o non valido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (L'utente non è un artigiano).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server durante il recupero delle informazioni sui clienti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /purchases/order/{id_order}:
    get:
      summary: Ottiene i dettagli di un singolo ordine
      tags:
        - Purchases
      description: Recupera i dettagli di un ordine specifico. Accessibile dall'utente che ha effettuato l'ordine o da un Amministratore.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id_order
          schema:
            type: integer
            format: int64
          required: true
          description: L'ID dell'ordine da recuperare.
      responses:
        '200':
          description: Dettagli dell'ordine recuperati con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-20T10:00:00.000Z"
                  user_name:
                    type: string
                    example: Mario
                  user_surname:
                    type: string
                    example: Rossi
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 101
                        name:
                          type: string
                          example: Vaso in Ceramica
                        quantity:
                          type: integer
                          example: 1
                        single_product_price:
                          type: number
                          format: float
                          example: 25.00
                        thumbnail:
                          type: string
                          format: url
                          example: https://localhost:3000/images/thumbnail_id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Ordine non trovato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: Not Found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/purchase:
    post:
      summary: Effettua un acquisto dal carrello
      tags:
        - Purchases
      description: Processa l'acquisto degli articoli presenti nel carrello dell'utente. Richiede il ruolo di Cliente.
                   Svuota il carrello dopo un acquisto riuscito.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Acquisto completato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: integer
                    description: ID del nuovo ordine creato.
                    example: 1
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 101
                        quantity:
                          type: integer
                          example: 1
                        single_product_price:
                          type: number
                          format: float
                          example: 25.00
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '524':
          description: Non ci sono abbastanza articoli disponibili per l'acquisto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 524
                message: Not enough items to purchase.
        '525':
          description: Carrello vuoto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 525
                message: Cart is empty.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/itemStatus:
    put:
      summary: Modifica lo stato di un articolo in un ordine
      tags:
        - Purchases
      description: Aggiorna lo stato di un singolo prodotto all'interno di un ordine. Accessibile da Artigiani (per i propri prodotti) o Amministratori.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
                - item_id
                - item_status
              properties:
                order_id:
                  type: integer
                  format: int64
                  description: L'ID dell'ordine a cui appartiene l'articolo.
                  example: 1
                item_id:
                  type: integer
                  format: int64
                  description: L'ID del prodotto (articolo) all'interno dell'ordine.
                  example: 101
                item_status:
                  type: string
                  description: Il nuovo stato dell'articolo.
                  example: "Spedito"
      responses:
        '200':
          description: Stato dell'articolo aggiornato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /purchases/report/{id_order}:
    post:
      summary: Segnala un acquisto/ordine
      tags:
        - Purchases
      description: Permette a un utente di segnalare un problema relativo a un ordine. Crea un nuovo ticket di tipo 'order'.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id_order
          schema:
            type: integer
            format: int64
          required: true
          description: L'ID dell'ordine da segnalare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: Descrizione del problema o motivo della segnalazione.
                  example: "L'ordine è incompleto o danneggiato."
      responses:
        '200':
          description: Ordine segnalato e ticket creato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_id:
                    type: integer
                    example: 456
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Ordine non trovato o non appartenente all'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: Not Found.
        '500':
          $ref: '#/components/responses/InternalServerError'

  # TICKETS MICROSERVICE PATHS
  /tickets:
    get:
      summary: Health check del servizio Tickets
      tags:
        - Health Check
      description: Verifica lo stato di salute del microservizio Tickets.
      responses:
        '200':
          description: Servizio attivo e funzionante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: tickets
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tickets/fetchTickets/{page}:
    get:
      summary: Ottiene tutti i ticket (di prodotto e ordine) con paginazione
      description: Permette a un amministratore di recuperare un elenco paginato di tutte le segnalazioni (ticket di prodotto e ticket di ordine) presenti nel sistema. Richiede il ruolo di Admin.
      operationId: fetchAllTicketsPaged
      tags:
        - Tickets
      security:
        - CookieAuth: []
      parameters:
        - in: path
          name: page
          schema:
            type: integer
            minimum: 1
          required: true
          description: Il numero della pagina di ticket da recuperare (a partire da 1).
      responses:
        '200':
          description: Elenco di ticket recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      type: object # Lo schema esatto di un ticket (prodotto o ordine) dovrebbe essere definito altrove se sono diversi
                      properties:
                        id:
                          type: integer
                          description: ID del ticket.
                        type:
                          type: string
                          enum: [product, order]
                          description: Tipo di ticket (prodotto o ordine).
                        status:
                          type: string
                          description: Stato attuale del ticket (es. Aperto, Chiuso).
                        note:
                          type: string
                          description: Descrizione del problema o nota del ticket.
                        timestamp_creation:
                          type: string
                          format: date-time
                          description: Timestamp di creazione del ticket.
                        timestamp_resolved:
                          type: string
                          format: date-time
                          nullable: true
                          description: Timestamp di risoluzione del ticket (se risolto).
                        # Aggiungere qui altre proprietà specifiche del ticket (es. id_product, id_order, id_user, id_admin)
                        # A seconda di come makeTicket formatta l'output, potrebbe essere necessario creare schemi distinti
                        # per ticket di prodotto e ticket di ordine, e usare `oneOf` o `anyOf` qui.
                        # Per semplicità, qui è un tipo generico.
                  pages:
                    type: integer
                    description: Il numero totale di pagine disponibili per tutti i ticket combinati.
                    minimum: 0
                  num_tickets:
                    type: integer
                    description: Il numero totale di ticket (di prodotto + di ordine) nel sistema.
                    minimum: 0
                required:
                  - tickets
                  - pages
                  - num_tickets
        '400':
          description: Richiesta non valida (es. numero di pagina mancante o non intero).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorizzato (token JWT mancante o non valido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (L'utente non è un amministratore).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server durante il recupero dei ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tickets/resolve/{ticket_type}/{ticket_id}:
    post:
      summary: Risolve un ticket
      tags:
        - Tickets
      description: Chiude un ticket di tipo 'product' o 'order', aggiornandone lo stato a 'Chiuso' e registrando l'amministratore che lo ha risolto. Richiede il ruolo di Amministratore e che il ticket sia attualmente 'Aperto'.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: ticket_type
          schema:
            type: string
            enum: [product, order]
          required: true
          description: Il tipo di ticket da risolvere ('product' o 'order').
        - in: path
          name: ticket_id
          schema:
            type: integer
            format: int64
          required: true
          description: L'ID numerico del ticket da risolvere.
      responses:
        '200':
          description: Ticket risolto con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Ticket non trovato o già risolto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: Not Found.
        '500':
          $ref: '#/components/responses/InternalServerError'

  # IMAGES MICROSERVICE PATHS
  /images:
    get:
      summary: Health check del servizio Images
      tags:
        - Health Check
      description: Verifica lo stato di salute del microservizio Images.
      responses:
        '200':
          description: Servizio attivo e funzionante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: images
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
  /images/upload:
    post:
      summary: Carica un'immagine
      tags:
        - Images
      description: Carica un'immagine (formato JPEG raccomandato, verrà convertita) e restituisce un ID univoco. Richiede autenticazione.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Il file immagine da caricare.
      responses:
        '200':
          description: Immagine caricata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                    format: uuid
                    description: L'ID univoco dell'immagine caricata.
                    example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '519':
          description: Nessun file immagine fornito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 519
                message: No image file provided.
        '520':
          description: Errore durante l'elaborazione dell'immagine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 520
                message: Error during image processing.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /images/{id}:
    get:
      summary: Recupera un'immagine per ID
      tags:
        - Images
      description: Recupera un file immagine tramite il suo ID univoco.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: L'ID univoco dell'immagine.
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      responses:
        '200':
          description: Immagine recuperata con successo.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Immagine non trovata o ID non valido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: Not Found.
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
      description: Autenticazione tramite cookie HTTP-only contenente il JWT.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: ID dell'utente
        email:
          type: string
          format: email
          description: Indirizzo email dell'utente
        name:
          type: string
          description: Nome dell'utente
        surname:
          type: string
          description: Cognome dell'utente
        role:
          type: string
          description: Ruolo dell'utente (es. customer, artisan, admin)
        bio:
          type: string
          nullable: true
          description: Biografia dell'utente (solo per artigiani e amministratori)
        url_profile_picture:
          type: string
          format: url
          nullable: true
          description: URL dell'immagine del profilo dell'utente
        reviews_total:
          type: integer
          description: Numero totale di recensioni ricevute (solo per artigiani)
          minimum: 0
        reviews_avg:
          type: number
          format: float
          description: Media delle recensioni ricevute (solo per artigiani)
          minimum: 0.0
          maximum: 5.0
      required:
        - id
        - email
        - name
        - surname
        - role
    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID univoco del prodotto.
          example: 101
        name:
          type: string
          description: Nome del prodotto.
          example: Vaso in Ceramica
        description:
          type: string
          description: Breve descrizione del prodotto.
          example: Vaso fatto a mano con argilla locale.
        price:
          type: number
          format: float
          description: Prezzo del prodotto in valuta.
          example: 25.50
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              link:
                type: string
            required:
              - id
              - name
              - link
          description: Categorie a cui appartiene il prodotto.
        artisan:
          type: object
          properties:
            name:
              type: string
            surname:
              type: string
            photoProfile:
              type: string
              format: url
              nullable: true
            link:
              type: string
              format: uri
            reviews_total:
              type: integer
              description: Numero totale di recensioni ricevute dall'artigiano
              minimum: 0
            reviews_avg:
              type: number
              format: float
              description: Media delle recensioni ricevute dall'artigiano (0.0-5.0)
              minimum: 0.0
              maximum: 5.0
          required:
            - name
            - surname
            - link
        link:
          type: string
          description: Link diretto al prodotto.
        quantity:
          type: integer
          description: Quantità disponibile del prodotto.
        visits:
          type: integer
          description: Numero di visite alla pagina del prodotto.
        thumbnail:
          type: string
          format: url
          description: URL dell'immagine thumbnail del prodotto.
      required:
        - id
        - name
        - description
        - price
        - categories
        - artisan
        - link
        - quantity
        - visits
        - thumbnail
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            images:
              type: array
              items:
                type: string
                format: url
              description: URL di tutte le immagini del prodotto.
            short_description:
              type: string
              description: Una descrizione più concisa del prodotto.
          required:
            - images
            - short_description
    CustomerOrderSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        timestamp:
          type: string
          format: date-time
          example: "2024-01-20T10:00:00.000Z"
        payment_intent:
          type: string
          example: "pi_xxxxxxx"
        amount_paid:
          type: number
          format: float
          example: 50.00
        num_products:
          type: integer
          example: 3
        products:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Vaso in Ceramica"
              thumbnail:
                type: string
                format: url
                example: "https://localhost:3000/images/thumb_id1"
        status:
          type: string
          example: "Pagato"
    ArtisanOrderItem:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
          example: 1
        product_id:
          type: integer
          format: int64
          example: 101
        quantity:
          type: integer
          example: 1
        single_product_price:
          type: number
          format: float
          example: 25.00
        status:
          type: string
          example: "Pagato"
        product_name:
          type: string
          example: "Vaso in Ceramica"
        product_thumbnail:
          type: string
          format: url
          example: "https://localhost:3000/images/thumb_id1"
    Ticket:
      type: object
      properties:
        type:
          type: string
          enum: [product, order]
          description: Tipo di ticket (prodotto o ordine).
          example: product
        id:
          type: integer
          format: int64
          description: ID del ticket.
          example: 1
        product_id:
          type: integer
          format: int64
          nullable: true
          description: ID del prodotto (se ticket di tipo 'product').
          example: 101
        order_id:
          type: integer
          format: int64
          nullable: true
          description: ID dell'ordine (se ticket di tipo 'order').
          example: 205
        user_id:
          type: integer
          format: int64
          description: ID dell'utente che ha aperto il ticket.
          example: 5
        timestamp_open:
          type: string
          format: date-time
          description: Timestamp di apertura del ticket.
          example: "2024-01-15T10:00:00.000Z"
        timestamp_resolved:
          type: string
          format: date-time
          nullable: true
          description: Timestamp di risoluzione del ticket (null se ancora aperto).
          example: null
        status:
          type: string
          description: Stato attuale del ticket.
          example: "Aperto"
        note:
          type: string
          nullable: true
          description: Note aggiuntive sul ticket.
          example: "Problema con la spedizione."
        resolved_by:
          type: integer
          format: int64
          nullable: true
          description: ID dell'amministratore che ha risolto il ticket (null se ancora aperto).
          example: 1
      required:
        - type
        - id
        - user_id
        - timestamp_open
        - status
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Codice di errore specifico del backend.
          example: 500
        message:
          type: string
          description: Descrizione leggibile dell'errore.
          example: Internal Server Error.
    Review:
      type: object
      properties:
        reviewer:
          type: integer
          format: int64
          description: ID dell'utente che ha lasciato la recensione.
        rating:
          type: integer
          description: Il voto della recensione (da 0 a 5).
          minimum: 0
          maximum: 5
        review_text:
          type: string
          description: Il testo della recensione.
        timestamp:
          type: string
          format: date-time
          description: Data e ora della recensione.
      required:
        - reviewer
        - rating
        - review_text
        - timestamp


  responses:
    BadRequest:
      description: Richiesta non valida. Campi obbligatori mancanti o formattati male.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: Bad Request.
    UnauthorizedError:
      description: Autenticazione richiesta o non valida (token JWT mancante/scaduto/non valido).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 401
            message: Unauthorized.
    ForbiddenError:
      description: L'utente non ha i permessi necessari per accedere a questa risorsa (es. non è un amministratore).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 403
            message: Forbidden.
    InternalServerError:
      description: Errore interno del server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 500
            message: Internal Server Error.