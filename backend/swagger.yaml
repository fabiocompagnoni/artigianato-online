                    properties:
                      total_refunds:
                        type: integer
                        description: Rimborsi totali.
                      total_refunds_last_days:
                        type: integer
                        description: Rimborsi negli ultimi 'days' giorni.
                      total_refunds_last_days_percent:
                        type: number
                        format: float
                        description: Percentuale di rimborsi negli ultimi 'days' giorni rispetto al totale.
                  performance:
                    type: object
                    properties:
                      sales:
                        type: object
                        additionalProperties:
                          type: number
                          format: float
                        description: Vendite per giorno (YYYY-MM-DD) negli ultimi 'days' giorni.
                      visits:
